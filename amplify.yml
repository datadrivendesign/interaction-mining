version: 1
frontend:
  phases:
    preBuild:
      commands:
        - env | grep -e NEXT_PUBLIC_ >> .env.production
        - env | grep -e _AWS >> .env.production
        - env | grep -e AUTH >> .env.production
        - env | grep -e GOOGLE >> .env.production
        - env | grep -e DATABASE_URL >> .env.production
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
